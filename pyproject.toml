[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-drone-patrol"
version = "0.1.0"
description = "Learned adaptive three-checkpoint inspection with verified physical arrivals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
routing = ["gymnasium==1.0.0", "stable-baselines3==2.4.1", "sb3-contrib==2.4.0", "matplotlib==3.10.6"]
dev = ["pytest==8.4.2", "ruff==0.13.2"]
report = ["reportlab==4.4.4", "fonttools==4.66.1", "Pillow==12.3.0"]
video = ["Pillow==12.3.0", "imageio-ffmpeg==0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires the verified remote Genesis GPU environment"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
